spring:
  application:
    name: user-service
  profiles:
    default: local
  jackson:
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devflow_user}
    username: ${DB_USERNAME:devflow}
    password: ${DB_PASSWORD:devflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    admin:
      fail-fast: false
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8280/realms/devflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8280/realms/devflow/protocol/openid-connect/certs}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

devflow:
  security:
    jwt:
      client-id: ${KEYCLOAK_WEB_CLIENT_ID:devflow-web}
  clients:
    organization-service-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8083}

logging:
  level:
    root: INFO
    com.devflow: DEBUG
  pattern:
    level: "%5p [corr=%X{correlationId}]"
