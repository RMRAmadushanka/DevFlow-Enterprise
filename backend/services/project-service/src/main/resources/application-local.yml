# Local developer overrides (host machine; no Docker DNS)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devflow_project}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/devflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/devflow/protocol/openid-connect/certs}

devflow:
  clients:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8082}
    organization-service-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8083}
  outbox:
    poll-interval-ms: 2000
    batch-size: 50

logging:
  level:
    com.devflow.project: DEBUG
