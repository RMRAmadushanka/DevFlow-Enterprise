spring:
  application:
    name: gateway-service
  profiles:
    default: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      # Rate limiting is enabled only in docker/prod profiles (needs RedisRateLimiter bean).
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/v1/auth/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**,/api/v1/user/**
        - id: organization-service
          uri: ${ORGANIZATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/organizations/**,/api/v1/organization/**,/api/teams/**,/api/invitations/**
        - id: project-service
          uri: ${PROJECT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/projects/**,/api/v1/project/**
        - id: task-service
          uri: ${TASK_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/tasks/**,/api/v1/task/**
        - id: sprint-service
          uri: ${SPRINT_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/sprints/**,/api/v1/sprint/**
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/documents/**,/api/v1/document/**
        - id: repository-service
          uri: ${REPOSITORY_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/repositories/**,/api/v1/repository/**
        - id: deployment-service
          uri: ${DEPLOYMENT_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/deployments/**,/api/v1/deployment/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/api/notifications/**,/api/v1/notification/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/analytics/**,/api/dashboard/**,/api/v1/analytics/**
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/audit-logs/**,/api/v1/audit/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8280/realms/devflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8280/realms/devflow/protocol/openid-connect/certs}

server:
  port: ${GATEWAY_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized

devflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    com.devflow.gateway: DEBUG
