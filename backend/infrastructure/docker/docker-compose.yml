name: devflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: devflow-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-devflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devflow}
      POSTGRES_DB: postgres
    # Host port must not fall in Windows Hyper-V excluded ranges (e.g. 15392–15491).
    # Default 5432; override via infrastructure/docker/.env or backend/.env POSTGRES_PORT.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/postgres/init/00-create-databases.sh:/docker-entrypoint-initdb.d/00-create-databases.sh:ro
    healthcheck:
      # Must target an existing DB (POSTGRES_DB=postgres). Default DB name = username ("devflow") does not exist.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-devflow} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: devflow-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-devflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devflow}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    # Bitnami moved public images to bitnamilegacy (bitnami/kafka:3.7 is 404)
    image: bitnamilegacy/kafka:3.7
    container_name: devflow-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kafka-init:
    image: bitnamilegacy/kafka:3.7
    container_name: devflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../kafka/create-topics-bitnami.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: devflow-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Local admin only — override in backend/.env; never reuse in production
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-devflow-kc-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangeMe-LocalOnly-Keycloak!}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ../keycloak/realm-devflow.json:/opt/keycloak/data/import/realm-devflow.json:ro
      - ../keycloak/themes/devflow:/opt/keycloak/themes/devflow:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 20s
      timeout: 5s
      retries: 15

  # Optional application stack — enable with: --profile apps
  # Requires: mvn -DskipTests package first
  auth-service:
    profiles: ["apps"]
    build:
      context: ../../services/auth-service
    container_name: devflow-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-devflow-gateway-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  user-service:
    profiles: ["apps"]
    build:
      context: ../../services/user-service
    container_name: devflow-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      ORGANIZATION_SERVICE_URL: http://organization-service:8083
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  organization-service:
    profiles: ["apps"]
    build:
      context: ../../services/organization-service
    container_name: devflow-organization
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      USER_SERVICE_URL: http://user-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
      user-service:
        condition: service_started

  project-service:
    profiles: ["apps"]
    build:
      context: ../../services/project-service
    container_name: devflow-project
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      USER_SERVICE_URL: http://user-service:8082
      ORGANIZATION_SERVICE_URL: http://organization-service:8083
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
      organization-service:
        condition: service_started

  task-service:
    profiles: ["apps"]
    build:
      context: ../../services/task-service
    container_name: devflow-task
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-devflow}
      DB_PASSWORD: ${DB_PASSWORD:-devflow}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  gateway-service:
    profiles: ["apps"]
    build:
      context: ../../gateway-service
    container_name: devflow-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/devflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/devflow/protocol/openid-connect/certs
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      ORGANIZATION_SERVICE_URL: http://organization-service:8083
      PROJECT_SERVICE_URL: http://project-service:8084
      TASK_SERVICE_URL: http://task-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEVFLOW_GATEWAY_RATE_LIMITER_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      organization-service:
        condition: service_started
      project-service:
        condition: service_started
      task-service:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
